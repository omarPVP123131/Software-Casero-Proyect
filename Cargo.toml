[workspace]
members = [
    "crates/physics",
    "crates/model",
    "crates/tauri_commands",
    "crates/wasm",
    "src-tauri",
]
default-members = ["crates/model", "crates/wasm", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "2.0.0"

[workspace.dependencies]
fotoelectrico-physics = { path = "crates/physics" }
photolab-model = { path = "crates/model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "12"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# wasm-pack builds the release profile; keep it small and fast.
[profile.release.package."*"]
opt-level = "s"
